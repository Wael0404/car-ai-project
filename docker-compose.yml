# Local development services. Production uses managed PostgreSQL and Redis.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: carai
      POSTGRES_PASSWORD: carai
      POSTGRES_DB: carai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
